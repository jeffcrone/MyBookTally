# Tests workflow.
#
# Builds the debug configuration and runs every automated test on Linux and
# on Windows, for every push to main and every pull request into main (when
# it is opened and on every later push to it).
#
# On a pull request it also posts the result as a comment, and updates that
# same comment on later runs instead of adding a new one each time.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"

jobs:
  test-linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ qt6-base-dev libqt6sql6-sqlite libgl-dev

      - name: Build and run the tests (debug configuration)
        run: cmake --workflow --preset linux-debug

  test-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Set up the Visual C++ environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset windows-debug -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build --preset windows-debug

      - name: Run the tests
        run: ctest --preset windows-debug

  report:
    name: Report on pull request
    needs: [test-linux, test-windows]
    # always(): report failures too, not only successes.
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the test result comment
        uses: actions/github-script@v7
        env:
          LINUX_RESULT: ${{ needs.test-linux.result }}
          WINDOWS_RESULT: ${{ needs.test-windows.result }}
        with:
          script: |
            const marker = '<!-- mybooktally-test-results -->';
            const icon = (result) => result === 'success' ? '✅ passed'
              : result === 'cancelled' ? '⚪ canceled' : '❌ failed';
            const linux = process.env.LINUX_RESULT;
            const windows = process.env.WINDOWS_RESULT;
            const allPassed = linux === 'success' && windows === 'success';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const body = [
              marker,
              `### ${allPassed ? '✅ All tests passed' : '❌ Some tests failed'}`,
              '',
              '| Platform | Result |',
              '| --- | --- |',
              `| Linux | ${icon(linux)} |`,
              `| Windows | ${icon(windows)} |`,
              '',
              `Commit ${sha} · [View the run](${runUrl})`,
            ].join('\n');

            // A pull request from a fork gets a read-only token, so the
            // comment cannot be posted. Put the result in the run summary
            // instead of failing this step.
            const fromFork = context.payload.pull_request.head.repo.full_name
              !== `${context.repo.owner}/${context.repo.repo}`;
            if (fromFork) {
              core.notice('Pull request from a fork: the token is read-only, so the result is in the run summary instead of a comment.');
              await core.summary.addRaw(body).write();
              return;
            }

            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
